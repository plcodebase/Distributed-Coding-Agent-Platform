name: podman-runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: podman-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-e2e:
    runs-on: [self-hosted, linux, podman, rootless]
    timeout-minutes: 60
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      PRE_COMMIT_HOME: ${{ github.workspace }}/.cache/pre-commit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - name: Verify dedicated rootless Podman runner
        run: make podman-preflight
      - name: Build pinned test inputs
        run: make podman-images
      - name: Build production application and node images
        run: make podman-production-images
      - name: Exercise sandbox security boundary
        run: make sandbox-security
      - name: Exercise gateway isolation and fallback
        run: make gateway-security ENV_FILE=.env.example
      - name: Exercise coding-agent happy path
        run: make e2e-happy ENV_FILE=.env.example
      - name: Exercise distributed storage, mTLS node, approval, and recovery path
        run: make distributed-e2e ENV_FILE=.env.example
      - name: Remove local dependency stack
        if: always()
        run: make compose-down ENV_FILE=.env.example
