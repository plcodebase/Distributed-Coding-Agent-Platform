name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AGENT_PLATFORM_DATABASE_URL: postgresql+asyncpg://agent_platform:agent_platform_test@127.0.0.1:5432/agent_platform
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Start PostgreSQL for migration verification
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set ON_ERROR_STOP=1 --command "CREATE USER agent_platform WITH PASSWORD 'agent_platform_test';"
          sudo -u postgres createdb --owner agent_platform agent_platform
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - run: make lint
      - run: make typecheck
      - run: make coverage
      - run: make integration
      - name: Apply and validate PostgreSQL migrations
        run: make migrate migration-check
      - run: make audit
      - run: make lock-check
      - run: make build-packages

  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - name: Validate immutable release image contracts
        run: make release-contract
      - run: sudo apt-get update
      - run: sudo apt-get install --yes podman
      - name: Validate Podman Compose configuration
        run: make compose-config ENV_FILE=.env.example
      - run: podman build --tag agent-platform-fake-llm:test --file services/fake-llm/Containerfile services/fake-llm
      - name: Start Podman dependency stack
        run: make compose-up ENV_FILE=.env.example
      - name: Verify dependency health and fake model routes
        run: make compose-smoke ENV_FILE=.env.example
      - name: Stop Podman dependency stack
        if: always()
        run: make compose-down ENV_FILE=.env.example
