[project]
name = "agent-platform"
version = "0.1.0"
description = "Distributed coding-agent platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agent-core",
  "agents-sdk-adapter",
  "gateway-client",
  "platform-telemetry",
  "sandbox-runtime",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "podman-compose>=1.5,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<8",
  "pyyaml>=6,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6,<7",
]

[tool.uv]
package = false

[tool.uv.sources]
agent-core = { workspace = true }
agents-sdk-adapter = { workspace = true }
gateway-client = { workspace = true }
platform-telemetry = { workspace = true }
sandbox-runtime = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/agent-core",
  "packages/agents-sdk-adapter",
  "packages/gateway-client",
  "packages/telemetry",
  "packages/sandbox-runtime",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires local infrastructure",
  "security: exercises security boundaries",
]

[tool.coverage.run]
branch = true
source = [
  "agent_core",
  "agents_sdk_adapter",
  "gateway_client",
  "platform_telemetry",
  "sandbox_runtime",
  "scripts",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "packages/agent-core/src",
  "packages/agents-sdk-adapter/src",
  "packages/gateway-client/src",
  "packages/telemetry/src",
  "packages/sandbox-runtime/src",
  "scripts",
  "tests",
]

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "DTZ",
  "E",
  "F",
  "FA",
  "I",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "PLR0913",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = [
  "packages/agent-core/src",
  "packages/agents-sdk-adapter/src",
  "packages/gateway-client/src",
  "packages/telemetry/src",
  "packages/sandbox-runtime/src",
]

[[tool.mypy.overrides]]
module = ["structlog.*"]
ignore_missing_imports = true
