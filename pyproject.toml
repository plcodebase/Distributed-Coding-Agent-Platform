[project]
name = "agent-platform"
version = "0.1.0"
description = "Distributed coding-agent platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agent-api",
  "agent-core",
  "agent-scheduler",
  "agent-worker",
  "agents-sdk-adapter",
  "artifact-store",
  "event-store",
  "gateway-client",
  "platform-persistence",
  "platform-telemetry",
  "queue-wakeup",
  "sandbox-runtime",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "podman-compose>=1.5,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<8",
  "pyyaml>=6,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6,<7",
  "websockets>=15,<16",
]

[tool.uv]
package = false

[tool.uv.sources]
agent-api = { workspace = true }
agent-core = { workspace = true }
agent-scheduler = { workspace = true }
agent-worker = { workspace = true }
agents-sdk-adapter = { workspace = true }
artifact-store = { workspace = true }
event-store = { workspace = true }
gateway-client = { workspace = true }
platform-persistence = { workspace = true }
platform-telemetry = { workspace = true }
queue-wakeup = { workspace = true }
sandbox-runtime = { workspace = true }

[tool.uv.workspace]
members = [
  "apps/agent-api",
  "apps/agent-worker",
  "apps/scheduler",
  "packages/agent-core",
  "packages/agents-sdk-adapter",
  "packages/artifact-store",
  "packages/event-store",
  "packages/gateway-client",
  "packages/persistence",
  "packages/queue-wakeup",
  "packages/telemetry",
  "packages/sandbox-runtime",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires local infrastructure",
  "security: exercises security boundaries",
]

[tool.coverage.run]
branch = true
source = [
  "agent_api",
  "agent_core",
  "agent_scheduler",
  "agent_worker",
  "agents_sdk_adapter",
  "artifact_store",
  "event_store",
  "gateway_client",
  "platform_persistence",
  "platform_telemetry",
  "queue_wakeup",
  "sandbox_runtime",
  "scripts",
]

[tool.coverage.paths]
source = [
  ".",
  "/workspace",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "apps/agent-api/src",
  "apps/agent-worker/src",
  "apps/scheduler/src",
  "packages/agent-core/src",
  "packages/agents-sdk-adapter/src",
  "packages/artifact-store/src",
  "packages/event-store/src",
  "packages/gateway-client/src",
  "packages/persistence/src",
  "packages/telemetry/src",
  "packages/queue-wakeup/src",
  "packages/sandbox-runtime/src",
  "scripts",
  "tests",
]

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "DTZ",
  "E",
  "F",
  "FA",
  "I",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RUF",
  "S",
  "SIM",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "PLR0913",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = [
  "apps/agent-api/src",
  "apps/agent-worker/src",
  "apps/scheduler/src",
  "packages/agent-core/src",
  "packages/agents-sdk-adapter/src",
  "packages/artifact-store/src",
  "packages/event-store/src",
  "packages/gateway-client/src",
  "packages/persistence/src",
  "packages/telemetry/src",
  "packages/queue-wakeup/src",
  "packages/sandbox-runtime/src",
]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "structlog.*"]
ignore_missing_imports = true
