[project]
name = "event-store"
version = "0.1.0"
description = "Durable PostgreSQL event sequencing and replay for the agent platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agent-core",
  "anyio>=4,<5",
  "platform-persistence",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_store"]

[tool.uv.sources]
agent-core = { workspace = true }
platform-persistence = { workspace = true }
