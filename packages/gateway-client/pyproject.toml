[project]
name = "gateway-client"
version = "0.1.0"
description = "Typed, bounded client for the centralized LiteLLM gateway"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agent-core",
  "agents-sdk-adapter",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_client"]

[tool.uv.sources]
agent-core = { workspace = true }
agents-sdk-adapter = { workspace = true }
