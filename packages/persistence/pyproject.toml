[project]
name = "platform-persistence"
version = "0.1.0"
description = "PostgreSQL persistence adapters for the agent platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agent-core",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.9,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_persistence"]

[tool.uv.sources]
agent-core = { workspace = true }
