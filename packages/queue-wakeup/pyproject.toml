[project]
name = "queue-wakeup"
version = "0.1.0"
description = "Redis-backed durable wakeups for the agent run queue"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic-settings>=2.9,<3",
  "redis>=5,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/queue_wakeup"]
