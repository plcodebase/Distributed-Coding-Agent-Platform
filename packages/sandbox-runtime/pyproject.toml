[project]
name = "sandbox-runtime"
version = "0.1.0"
description = "Rooted workspace, Git checkpoint, and local execution adapters"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agent-core",
  "platform-telemetry",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_runtime"]

[tool.uv.sources]
agent-core = { workspace = true }
platform-telemetry = { workspace = true }
