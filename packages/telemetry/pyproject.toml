[project]
name = "platform-telemetry"
version = "0.1.0"
description = "Structured logging and secret redaction for the agent platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "prometheus-client>=0.22,<1",
  "structlog>=25.2,<26",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_telemetry"]
