[project]
name = "agent-cli"
version = "0.1.0"
description = "Typed event renderer and local in-memory coding-agent client"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agent-core",
  "agents-sdk-adapter",
  "gateway-client",
  "platform-telemetry",
  "sandbox-runtime",
]

[project.scripts]
agent-platform = "agent_cli.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_cli"]

[tool.uv.sources]
agent-core = { workspace = true }
agents-sdk-adapter = { workspace = true }
gateway-client = { workspace = true }
platform-telemetry = { workspace = true }
sandbox-runtime = { workspace = true }
