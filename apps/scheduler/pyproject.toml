[project]
name = "agent-scheduler"
version = "0.1.0"
description = "Lease-expiry recovery scheduler for the coding-agent platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agent-core",
  "agents-sdk-adapter",
  "artifact-store",
  "gateway-client",
  "platform-persistence",
  "platform-telemetry",
  "queue-wakeup",
  "pydantic-settings>=2.9,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_scheduler"]

[tool.uv.sources]
agent-core = { workspace = true }
agents-sdk-adapter = { workspace = true }
artifact-store = { workspace = true }
gateway-client = { workspace = true }
platform-persistence = { workspace = true }
platform-telemetry = { workspace = true }
queue-wakeup = { workspace = true }
