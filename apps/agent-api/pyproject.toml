[project]
name = "agent-api"
version = "0.1.0"
description = "Tenant-authenticated HTTP and WebSocket API for the agent platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agent-core",
  "artifact-store",
  "event-store",
  "platform-persistence",
  "anyio>=4,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic-settings>=2.9,<3",
  "starlette>=0.40,<2",
  "uvicorn[standard]>=0.34,<1",
  "platform-telemetry",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_api"]

[tool.uv.sources]
agent-core = { workspace = true }
artifact-store = { workspace = true }
event-store = { workspace = true }
platform-persistence = { workspace = true }
platform-telemetry = { workspace = true }
