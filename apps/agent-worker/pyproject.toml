[project]
name = "agent-worker"
version = "0.1.0"
description = "Distributed execution worker for the coding-agent platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "agent-core",
  "agents-sdk-adapter",
  "event-store",
  "gateway-client",
  "platform-persistence",
  "queue-wakeup",
  "platform-telemetry",
  "pydantic-settings>=2.9,<3",
  "sandbox-node-agent",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_worker"]

[tool.uv.sources]
agent-core = { workspace = true }
agents-sdk-adapter = { workspace = true }
event-store = { workspace = true }
gateway-client = { workspace = true }
platform-persistence = { workspace = true }
platform-telemetry = { workspace = true }
queue-wakeup = { workspace = true }
sandbox-node-agent = { workspace = true }
