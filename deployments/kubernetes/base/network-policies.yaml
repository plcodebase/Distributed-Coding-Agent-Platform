spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: sandbox-node-agent}}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 192.0.2.0/24}}]
      ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 443}]
