---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-worker-to-sandbox-node}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: sandbox-node-agent}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: agent-worker}}}]
      ports: [{protocol: TCP, port: 9443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
