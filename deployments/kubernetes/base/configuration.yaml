apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-config
data:
  AGENT_PLATFORM_ENVIRONMENT: production
  AGENT_PLATFORM_LOG_JSON: "true"
  AGENT_PLATFORM_LOG_LEVEL: INFO
  AGENT_PLATFORM_GATEWAY_URL: http://litellm:4000
  AGENT_PLATFORM_TELEMETRY_ENVIRONMENT: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      - model_name: coding-default
        litellm_params:
          model: os.environ/OPENAI_MODEL
          api_key: os.environ/OPENAI_API_KEY
      - model_name: coding-fast
        litellm_params:
          model: os.environ/OPENAI_MODEL
          api_key: os.environ/OPENAI_API_KEY
      - model_name: coding-strong
        litellm_params:
          model: os.environ/ANTHROPIC_MODEL
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: summarization
        litellm_params:
          model: os.environ/OPENAI_MODEL
          api_key: os.environ/OPENAI_API_KEY
      - model_name: code-review
        litellm_params:
          model: os.environ/ANTHROPIC_MODEL
          api_key: os.environ/ANTHROPIC_API_KEY
    router_settings:
      num_retries: 2
      retry_after: 1
      fallbacks:
        - coding-default: [coding-strong]
        - coding-fast: [coding-default]
        - code-review: [coding-strong]
      allowed_fails: 5
      cooldown_time: 60
    litellm_settings:
      callbacks: [prometheus]
      request_timeout: 120
      set_verbose: false
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      disable_spend_logs: false
