apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: agent-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agent-api, agent-platform.openai.com/role: control-plane}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: agent-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: agent-api}}}
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: agent-api}}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app.kubernetes.io/name: agent-api}}}
      containers:
        - name: agent-api
          image: agent-platform:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/workspace/.venv/bin/uvicorn"]
          args: ["agent_api.factory:create_production_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: agent-platform-config}}]
          env:
            - {name: AGENT_PLATFORM_API_CREDENTIALS_JSON, valueFrom: {secretKeyRef: {name: agent-platform-api-runtime, key: api-credentials-json}}}
            - {name: AGENT_PLATFORM_DATABASE_URL, valueFrom: {secretKeyRef: {name: agent-platform-api-runtime, key: database-url}}}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
