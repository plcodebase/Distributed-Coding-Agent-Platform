          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: scheduler}
  template:
    metadata:
      labels: {app.kubernetes.io/name: scheduler, agent-platform.openai.com/role: scheduler}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: scheduler
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: scheduler}}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app.kubernetes.io/name: scheduler}}}
      containers:
        - name: scheduler
          image: agent-platform:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["-m", "agent_scheduler", "--factory", "agent_scheduler.production:create_production_scheduler", "--operations-port", "9090"]
          env:
            - {name: AGENT_SCHEDULER_INSTANCE_ID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}
            - {name: AGENT_PLATFORM_DATABASE_URL, valueFrom: {secretKeyRef: {name: agent-platform-scheduler-runtime, key: database-url}}}
            - {name: AGENT_PLATFORM_REDIS_URL, valueFrom: {secretKeyRef: {name: agent-platform-scheduler-runtime, key: redis-url}}}
            - {name: AGENT_PLATFORM_S3_ENDPOINT, valueFrom: {secretKeyRef: {name: agent-platform-scheduler-runtime, key: s3-endpoint}}}
            - {name: AGENT_PLATFORM_S3_ACCESS_KEY, valueFrom: {secretKeyRef: {name: agent-platform-scheduler-runtime, key: s3-access-key}}}
            - {name: AGENT_PLATFORM_S3_SECRET_KEY, valueFrom: {secretKeyRef: {name: agent-platform-scheduler-runtime, key: s3-secret-key}}}
            - {name: AGENT_PLATFORM_GATEWAY_API_KEY, valueFrom: {secretKeyRef: {name: agent-platform-scheduler-runtime, key: gateway-api-key}}}
            - {name: AGENT_SCHEDULER_ROUTE_PRICES_JSON, valueFrom: {secretKeyRef: {name: agent-platform-scheduler-runtime, key: route-prices-json}}}
          envFrom: [{configMapRef: {name: agent-platform-config}}]
          readinessProbe: {httpGet: {path: /ready, port: ops}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /live, port: ops}, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          ports: [{name: ops, containerPort: 9090}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: agent-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: agent-worker, agent-platform.openai.com/role: worker}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: agent-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      terminationGracePeriodSeconds: 180
      securityContext: {runAsNonRoot: true, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      nodeSelector: {agent-platform.openai.com/sandbox-worker: "true"}
      tolerations:
        - {key: agent-platform.openai.com/sandbox-worker, operator: Equal, value: "true", effect: NoSchedule}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app.kubernetes.io/name: agent-worker}}}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app.kubernetes.io/name: agent-worker}}
      containers:
        - name: agent-worker
          image: agent-platform:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["-m", "agent_worker", "--factory", "agent_worker.production:create_production_worker", "--processes", "1", "--operations-port", "9090"]
          env:
            - {name: AGENT_WORKER_INSTANCE_ID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}
            - {name: AGENT_PLATFORM_DATABASE_URL, valueFrom: {secretKeyRef: {name: agent-platform-worker-runtime, key: database-url}}}
            - {name: AGENT_PLATFORM_REDIS_URL, valueFrom: {secretKeyRef: {name: agent-platform-worker-runtime, key: redis-url}}}
            - {name: AGENT_PLATFORM_GATEWAY_API_KEY, valueFrom: {secretKeyRef: {name: agent-platform-worker-runtime, key: gateway-api-key}}}
            - {name: AGENT_WORKER_ROUTE_PRICES_JSON, valueFrom: {secretKeyRef: {name: agent-platform-worker-runtime, key: route-prices-json}}}
            - {name: AGENT_WORKER_ROUTE_CONTEXT_BUDGETS_JSON, valueFrom: {secretKeyRef: {name: agent-platform-worker-runtime, key: route-context-budgets-json}}}
            - {name: AGENT_WORKER_NODE_AGENT_URL, value: https://sandbox-node-agent:9443}
            - {name: AGENT_WORKER_NODE_AGENT_CA_FILE, value: /var/run/agent-node-tls/ca.crt}
            - {name: AGENT_WORKER_NODE_AGENT_CERTIFICATE_FILE, value: /var/run/agent-node-tls/tls.crt}
            - {name: AGENT_WORKER_NODE_AGENT_PRIVATE_KEY_FILE, value: /var/run/agent-node-tls/tls.key}
          envFrom: [{configMapRef: {name: agent-platform-config}}]
          ports: [{name: ops, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /ready, port: ops}, periodSeconds: 3, timeoutSeconds: 2, failureThreshold: 2}
          livenessProbe: {httpGet: {path: /live, port: ops}, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          lifecycle:
            preStop:
              exec:
                command:
                  - /workspace/.venv/bin/python
                  - -c
                  - "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:9090/drain', method='POST'), timeout=5).read()"
          resources: {requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 2Gi}, limits: {cpu: "4", memory: 8Gi, ephemeral-storage: 20Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: node-tls, mountPath: /var/run/agent-node-tls, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        - {name: node-tls, secret: {secretName: agent-platform-worker-node-tls, defaultMode: 0440}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: litellm}
  template:
    metadata:
      labels: {app.kubernetes.io/name: litellm, agent-platform.openai.com/role: model-gateway}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: litellm
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: litellm}}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app.kubernetes.io/name: litellm}}}
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-v1.74.9-stable
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/litellm/config.yaml", "--host", "0.0.0.0", "--port", "4000", "--num_workers", "1"]
          env:
            - {name: OPENAI_API_KEY, valueFrom: {secretKeyRef: {name: agent-platform-provider, key: openai-api-key}}}
            - {name: OPENAI_MODEL, valueFrom: {secretKeyRef: {name: agent-platform-provider, key: openai-model}}}
            - {name: ANTHROPIC_API_KEY, valueFrom: {secretKeyRef: {name: agent-platform-provider, key: anthropic-api-key}}}
            - {name: ANTHROPIC_MODEL, valueFrom: {secretKeyRef: {name: agent-platform-provider, key: anthropic-model}}}
            - {name: LITELLM_MASTER_KEY, valueFrom: {secretKeyRef: {name: agent-platform-provider, key: litellm-master-key}}}
          ports: [{name: http, containerPort: 4000}]
          readinessProbe: {httpGet: {path: /health/readiness, port: http}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health/liveliness, port: http}, initialDelaySeconds: 15, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3}
          resources: {requests: {cpu: 500m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsUser: 65532, runAsGroup: 65532, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /etc/litellm, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: litellm-config}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sandbox-node-agent
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: sandbox-node-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sandbox-node-agent, agent-platform.openai.com/role: sandbox-node}
    spec:
      serviceAccountName: sandbox-node-agent
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      terminationGracePeriodSeconds: 180
      nodeSelector: {agent-platform.openai.com/sandbox-worker: "true"}
      tolerations:
        - {key: agent-platform.openai.com/sandbox-worker, operator: Equal, value: "true", effect: NoSchedule}
      securityContext: {runAsNonRoot: true, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: sandbox-node-agent}}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app.kubernetes.io/name: sandbox-node-agent}}}
      containers:
        - name: sandbox-node-agent
          image: agent-platform-node:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["-m", "sandbox_node_agent"]
          ports: [{name: https, containerPort: 9443}]
          envFrom: [{configMapRef: {name: agent-platform-config}}]
          env:
            - {name: AGENT_PLATFORM_DATABASE_URL, valueFrom: {secretKeyRef: {name: agent-platform-node-runtime, key: database-url}}}
            - {name: AGENT_PLATFORM_S3_ENDPOINT, valueFrom: {secretKeyRef: {name: agent-platform-node-runtime, key: s3-endpoint}}}
            - {name: AGENT_PLATFORM_S3_ACCESS_KEY, valueFrom: {secretKeyRef: {name: agent-platform-node-runtime, key: s3-access-key}}}
            - {name: AGENT_PLATFORM_S3_SECRET_KEY, valueFrom: {secretKeyRef: {name: agent-platform-node-runtime, key: s3-secret-key}}}
            - {name: AGENT_NODE_SANDBOX_IMAGE, valueFrom: {secretKeyRef: {name: agent-platform-node-runtime, key: sandbox-image-digest}}}
            - {name: AGENT_NODE_WORKSPACE_PARENT, value: /var/lib/agent-platform/workspaces}
            - {name: AGENT_NODE_PODMAN_EXECUTABLE, value: /usr/bin/podman}
            - {name: AGENT_NODE_PODMAN_SOCKET, value: /run/user/1000/podman/podman.sock}
            - {name: AGENT_NODE_PODMAN_HOME, value: /home/agent-node}
            - {name: AGENT_NODE_GIT_EXECUTABLE, value: /usr/bin/git}
            - {name: AGENT_NODE_RIPGREP_EXECUTABLE, value: /usr/bin/rg}
            - {name: AGENT_NODE_TLS_CA_FILE, value: /var/run/agent-node-tls/ca.crt}
            - {name: AGENT_NODE_TLS_CERTIFICATE_FILE, value: /var/run/agent-node-tls/tls.crt}
            - {name: AGENT_NODE_TLS_PRIVATE_KEY_FILE, value: /var/run/agent-node-tls/tls.key}
          readinessProbe: {tcpSocket: {port: https}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {tcpSocket: {port: https}, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          resources: {requests: {cpu: 500m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsUser: 1000, runAsGroup: 1000, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: workspaces, mountPath: /var/lib/agent-platform/workspaces}
            - {name: podman-socket, mountPath: /run/user/1000/podman/podman.sock}
            - {name: node-home, mountPath: /home/agent-node}
            - {name: node-tls, mountPath: /var/run/agent-node-tls, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        - {name: workspaces, hostPath: {path: /var/lib/agent-platform/workspaces, type: Directory}}
        - {name: podman-socket, hostPath: {path: /run/user/1000/podman/podman.sock, type: Socket}}
        - {name: node-home, emptyDir: {sizeLimit: 64Mi}}
        - {name: node-tls, secret: {secretName: agent-platform-node-tls, defaultMode: 0440}}
