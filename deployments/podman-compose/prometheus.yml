global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: litellm
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/litellm-master-key
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: agent-platform-host
    static_configs:
      - targets: ["host.containers.internal:8000"]
