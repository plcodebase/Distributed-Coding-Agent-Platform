repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check apps packages scripts tests services/fake-llm/app.py
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check apps packages scripts tests services/fake-llm/app.py
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy apps packages scripts tests
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: pytest-unit
        name: unit tests
        entry: uv run pytest tests/unit
        language: system
        types: [python]
        pass_filenames: false
